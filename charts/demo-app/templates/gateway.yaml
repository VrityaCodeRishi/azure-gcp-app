{{- if .Values.gateway.enabled }}
{{- $https := .Values.gateway.https }}
{{- $redirect := and $https.enabled $https.redirectHttp }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
  {{- if $https.enabled }}
  annotations:
    networking.gke.io/certmap: {{ $https.certificateMap | quote }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  {{- with .Values.gateway.staticIpName }}
  addresses:
    - type: NamedAddress
      value: {{ . | quote }}
  {{- end }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
    {{- if $https.enabled }}
    # TLS is terminated with the certificate map from the annotation, so no tls block here
    - name: https
      protocol: HTTPS
      port: 443
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}
      {{- if $redirect }}
      sectionName: https
      {{- end }}
  rules:
    - backendRefs:
        - name: {{ .Release.Name }}
          port: {{ .Values.service.port }}
{{- if $redirect }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-http-redirect
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
---
# The load balancer health-checks "/" by default; point it at the app's health endpoint.
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        port: {{ .Values.containerPort }}
        requestPath: /healthz
  targetRef:
    group: ""
    kind: Service
    name: {{ .Release.Name }}
{{- end }}
